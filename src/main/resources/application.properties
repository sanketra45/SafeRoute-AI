spring.application.name=project

# ── Database ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:saferoute
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console



# ── JWT ────────────────────────────────────────────────────────────
# 64-char base64-safe secret (change in production!)
jwt.secret=saferoute-super-secret-key-change-me-in-production-32chars-min
# 24 hours in milliseconds
jwt.expiration=86400000

# ── Server ─────────────────────────────────────────────────────────
server.port=8080

# ── ML Microservice ────────────────────────────────────────────────
ml.service.url=http://localhost:5001

# ── External API Keys (optional — mock responses returned if blank) ─
weather.api.key=
traffic.api.key=
