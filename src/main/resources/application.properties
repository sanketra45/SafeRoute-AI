spring.application.name=project

# ── Database ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/saferoute
spring.datasource.username=root
spring.datasource.password=Sanku@45
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ────────────────────────────────────────────────────────────
# 64-char base64-safe secret (change in production!)
jwt.secret=saferoute-super-secret-key-change-me-in-production-32chars-min
# 24 hours in milliseconds
jwt.expiration=86400000

# ── Server ─────────────────────────────────────────────────────────
server.port=8080

# ── ML Microservice ────────────────────────────────────────────────
ml.service.url=http://localhost:5001

# ── External API Keys (optional — mock responses returned if blank) ─
weather.api.key=
traffic.api.key=
