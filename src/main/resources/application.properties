spring.application.name=SafeRoute

# ================= DATABASE (SUPABASE POSTGRESQL) =================

spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.ocgpxqjchzowpocvgytb
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================= JPA / HIBERNATE =================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================= JWT =================

jwt.secret=${APP_JWT_SECRET}
jwt.expiration=86400000

# ================= SERVER =================

server.port=8080

# Comma-separated browser origins allowed to call this API. The Render
# CORS_ALLOWED_ORIGINS setting may override this list for additional frontend domains.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://safe-route-ai-tau.vercel.app,https://safe-route-ar0clsy4k-sanket-rathods-projects-3cbc9c96.vercel.app,http://localhost:5173,http://localhost:3000}

# ================= ML MICROSERVICE =================

ml.service.url=${ML_SERVICE_URL:http://localhost:5001}

# ================= EXTERNAL API KEYS =================

weather.api.key=${WEATHER_API_KEY:}
traffic.api.key=${TRAFFIC_API_KEY:}

# ================= ADMIN BOOTSTRAP =================

admin.init.secret=${ADMIN_INIT_SECRET:}
